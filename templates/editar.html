{% extends 'base.html' %}

{% block contenido %}

<div class="row justify-content-center">
    <div class="col-lg-8">
        <section class="card shadow-sm">
            <div class="card-body p-4">

                <h2 class="h4 mb-3">Editar caso</h2>

                <form method="post"
                      action="{{ url_for('editar', id=caso._id) }}">

                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            Nombre del caso
                        </label>

                        <input
                            id="nombre"
                            name="nombre"
                            class="form-control"
                            value="{{ caso.nombre }}"
                            required
                            maxlength="80"
                        >
                    </div>

                    <div class="mb-3">
                        <label for="categoria" class="form-label">
                            Categoría
                        </label>

                        <input
                            id="categoria"
                            name="categoria"
                            class="form-control"
                            value="{{ caso.categoria }}"
                            required
                            maxlength="20"
                        >
                    </div>

                    <div class="mb-3">
                        <label for="estado" class="form-label">
                            Estado del caso
                        </label>

                        <select
                            id="estado"
                            name="estado"
                            class="form-select"
                            required
                        >
                            <option value="">Selecciona un estado</option>

                            {% for opcion in ['Disponible', 'Bloqueado'] %}
                            <option
                                value="{{ opcion }}"
                                {% if caso.get('estado') == opcion %}selected{% endif %}
                            >
                                {{ opcion }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex gap-2 flex-wrap">
                        <button type="submit" class="btn btn-primary">
                            Guardar cambios
                        </button>

                        <a
                            class="btn btn-outline-secondary"
                            href="{{ url_for('taller') }}#lista"
                        >
                            Cancelar
                        </a>
                    </div>

                </form>

            </div>
        </section>
    </div>
</div>

{% endblock %}
